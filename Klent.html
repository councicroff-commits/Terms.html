<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KLent & HYC Mystery Calculator</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    font-family:Arial, sans-serif;
    overflow:hidden;
}

/* BIG Floating Hearts */
.hearts{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    pointer-events:none;
    z-index: 0;
    }
    

.hearts span{
    position:absolute;
    bottom:-100px;
    font-size:40px;
    animation:float 10s linear infinite;
    opacity:0.9;
}

.hearts span:nth-child(1){ left:10%; animation-delay:0s;}
.hearts span:nth-child(2){ left:25%; animation-delay:2s;}
.hearts span:nth-child(3){ left:40%; animation-delay:4s;}
.hearts span:nth-child(4){ left:60%; animation-delay:1s;}
.hearts span:nth-child(5){ left:75%; animation-delay:3s;}
.hearts span:nth-child(6){ left:90%; animation-delay:5s;}
.hearts span:nth-child(8){ left:70%; animation-delay:4s;}

@keyframes float{
    0%{ transform:translateY(0) scale(1); opacity:1;}
    100%{ transform:translateY(-110vh) scale(1.5); opacity:0;}
}

/* Calculator Card */
.calculator{
    position:relative;
    z-index:2;
    width:350px;
    background:rgba(255,255,255,0.25);
    backdrop-filter:blur(15px);
    padding:20px;
    border-radius:25px;
    box-shadow:0 15px 40px rgba(0,0,0,0.3);
}

/* Secret Codes Box */
.secret-box{
    background:rgba(255,255,255,0.4);
    padding:10px;
    border-radius:15px;
    font-size:12px;
    margin-bottom:15px;
    text-align:center;
}

/* Display */
#display{
    width:100%;
    height:60px;
    margin-bottom:15px;
    font-size:20px;
    text-align:right;
    padding:10px;
    border-radius:15px;
    border:none;
    outline:none;
}

/* Buttons */
.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

button{
    padding:15px;
    font-size:18px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    background:white;
    transition:0.2s;
}

button:hover{
    transform:scale(1.05);
}

.equal{
    background:#4CAF50;
    color:white;
}

.clear{
    background:#ff3b3b;
    color:white;
    grid-column:span 4;
}
</style>
</head>

<body>

<div class="hearts">
<span>💖</span>
<span>💘</span>
<span>💕</span>
<span>💗</span>
<span>❤️</span>
<span>💓</span>
<span>🥰</span>
<span>💗</span>
</div>

<div class="calculator">

<div class="secret-box">
<b>Secret Codes:</b><br>
180 =  <br>
170 =  <br>
160 =  <br>
150 =  <br>
140 =  <br>
130 = <br>
120 =  <br>
110 =  <br>
143 = <br>
190 = <br>
666 =
</div>

<input type="text" id="display" disabled>

<div class="buttons">
<button onclick="press('7')">7</button>
<button onclick="press('8')">8</button>
<button onclick="press('9')">9</button>
<button onclick="press('/')">/</button>

<button onclick="press('4')">4</button>
<button onclick="press('5')">5</button>
<button onclick="press('6')">6</button>
<button onclick="press('*')">*</button>

<button onclick="press('1')">1</button>
<button onclick="press('2')">2</button>
<button onclick="press('3')">3</button>
<button onclick="press('-')">-</button>

<button onclick="press('0')">0</button>
<button onclick="press('.')">.</button>
<button class="equal" onclick="calculate()">=</button>
<button onclick="press('+')">+</button>

<button class="clear" onclick="clearDisplay()">C</button>
</div>

</div>

<script>
let display = document.getElementById("display");

function press(val){
    display.value += val;
}
<!-- <!--  --> -->
function clearDisplay(){
    display.value = "";
}

function calculate(){
    let input = display.value;

    const secrets = {
        "180":"I crush you 💘",
        "170":"I like you 💕",
        "160":"I hate you 😡",
        "150":"bayad sa Daan usa tira HAHAHA 🤣",
        "140":"gwapa & ka 😍",
        "130":"sarapp kaayu ka 😏",
        "120":"palautog 😳",
        "110":"ex crush you 😶",
        "143":"I love you 💖",
        "190":"I miss you 💗",
        "666":"dont cry 😭 "
    };

    if(secrets[input]){
        display.value = secrets[input];
        return;
    }

    try{
        display.value = eval(input);
    }catch{
        display.value = "Error";
    }
}
</script>

</body>
</html>
